<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      pinch-zoom 비활성화: iOS WebView 에서 의도치 않은 줌이 발생하지 않도록 막음.
      viewport-fit=cover: 노치/홈 인디케이터 영역까지 배경을 채움(safe-area 이용 가능).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>오늘케미</title>
    <!--
      테마·글자 크기 pre-paint 적용(FOUC 방지). React 마운트 전에 동기 실행한다.
      저장값(twoday_theme/twoday_font_scale)이 없으면 OS 선호를 따른다.
      matchMedia 는 try/catch 밖이라 localStorage 가 막혀도 data-theme 은 항상 설정된다.
      use-preferences 스토어가 동일 키를 읽어 상태를 동기화한다.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        var t = null;
        try { t = localStorage.getItem('twoday_theme'); } catch (e) {}
        var dark = t ? t === 'dark'
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
        var f = null;
        try { f = localStorage.getItem('twoday_font_scale'); } catch (e) {}
        if (f === 'large') d.setAttribute('data-font-scale', 'large');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
