<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      pinch-zoom 비활성화: iOS WebView 에서 의도치 않은 줌이 발생하지 않도록 막음.
      viewport-fit=cover: 노치/홈 인디케이터 영역까지 배경을 채움(safe-area 이용 가능).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>오늘케미</title>
    <!--
      Pretendard Variable 동적 서브셋(사용 글리프만 로드). 시그니처 디스플레이 폰트.
      토스 WebView 에서 CDN 차단 시 system-ui 폴백(회귀 없음) — 온디바이스 폴백 관찰되면
      번들 woff2 서브셋으로 교체. Pretendard = OFL(무료).
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!--
      라이트 모드·글자 크기 pre-paint 적용(FOUC 방지). 비게임 출시 가이드는
      라이트 모드 기준이므로 OS/저장 테마와 무관하게 data-theme="light" 로 고정한다.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        d.setAttribute('data-theme', 'light');
        var f = null;
        try { f = localStorage.getItem('twoday_font_scale'); } catch (e) {}
        if (f === 'large') d.setAttribute('data-font-scale', 'large');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
